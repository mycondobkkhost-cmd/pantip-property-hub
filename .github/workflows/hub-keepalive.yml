# Ping Property Hub so Render free tier sleeps less often.
# Does not touch LivingBKK / realxtateth.com apex.
name: Hub keepalive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping hub.realxtateth.com
        run: |
          set -e
          for url in \
            "https://hub.realxtateth.com/api/health" \
            "https://property-hub-y7ai.onrender.com/api/health"
          do
            code=$(curl -sS -o /tmp/hub_health.json -w "%{http_code}" --max-time 60 "$url" || echo "000")
            echo "$url -> HTTP $code"
            head -c 200 /tmp/hub_health.json; echo
            if [ "$code" = "200" ]; then
              exit 0
            fi
          done
          echo "keepalive failed"
          exit 1
