# Deploy Property Hub to Fly.io — manual only (workflow_dispatch).
# Does not touch LivingBKK / apex realxtateth.com.
# Production deploys require explicit operator approval in GitHub Actions.
name: Fly deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ secrets.FLY_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
