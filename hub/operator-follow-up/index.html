<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>งานติดตามทรัพย์ — Pantip Hub</title>
  <style>
    :root{--bg:#f4f6f8;--card:#fff;--text:#1a1a1a;--muted:#5c6570;--accent:#0b6e4f;--warn:#b45309;--border:#e2e8f0}
    body{margin:0;font-family:"Noto Sans Thai",system-ui,sans-serif;background:var(--bg);color:var(--text)}
    .banner{background:#fff7ed;border-bottom:2px solid #fdba74;padding:10px;text-align:center;font-weight:600;color:#9a3412}
    header{padding:12px 16px;background:#fff;border-bottom:1px solid var(--border)}
    main{max-width:1100px;margin:0 auto;padding:16px}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:16px}
    .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px}
    .card h3{margin:0 0 4px;font-size:.82rem;color:var(--muted)}
    .card .n{font-size:1.4rem;font-weight:700}
    table{width:100%;border-collapse:collapse;font-size:.82rem}
    th,td{padding:8px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
    .tag{display:inline-block;padding:2px 8px;border-radius:6px;background:#e2e8f0;font-size:.72rem}
    .tag.warn{background:#fef3c7;color:#92400e}
    nav a{margin-right:10px;color:var(--accent);font-size:.9rem}
    button{padding:8px 12px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;margin:4px 6px 4px 0}
    .muted{color:var(--muted);font-size:.85rem}
    h2{font-size:1rem;margin:16px 0 8px}
  </style>
</head>
<body>
  <div class="banner">⚠️ TEST_ONLY — Backlog ≠ Active Queue | ควบคุมความจุรายวัน</div>
  <header>
    <h1>งานติดตามทรัพย์</h1>
    <nav>
      <a href="/operator-policy-review/">นโยบาย (ทบทวน)</a>
      <a href="/lease-capture/">บันทึกสัญญา</a>
      <a href="/listing-freshness/">ความสดประกาศ</a>
    </nav>
  </header>
  <main>
    <div class="grid" id="cats"></div>
    <div class="card">
      <button id="pullBtn">ดึงงานเข้าคิว</button>
      <button id="seedBtn">โหลดข้อมูลทดสอบ</button>
      <button id="syncBtn">ซิงก์การแจ้งเตือน (ภายใน)</button>
      <p class="muted" id="meta"></p>
      <p class="muted" id="cap"></p>
    </div>
    <h2>คิวงาน Active</h2>
    <div class="card"><table><thead><tr><th>รหัส</th><th>อายุ</th><th>ประเภท</th><th>สถานะ</th><th>ผู้รับผิดชอบ</th></tr></thead><tbody id="queueRows"></tbody></table></div>
    <h2>Backlog ตัวอย่าง (ยังไม่ดึงเข้าคิว)</h2>
    <div class="card"><table><thead><tr><th>รหัส</th><th>โครงการ</th><th>อายุ (วัน)</th><th>คะแนน</th></tr></thead><tbody id="backlogRows"></tbody></table></div>
  </main>
  <script>
    async function api(p,o){const r=await fetch(p,{credentials:'same-origin',...o});return r.json()}
    function tag(s){return `<span class="tag ${/OVERDUE|STALE|DEFER/.test(s)?'warn':''}">${s||'-'}</span>`}
    async function load(){
      const d=await api('/api/operator-follow-up');
      const cm=d.capacity_model||{};
      document.getElementById('meta').textContent=`Backlog เข้าเกณฑ์: ${cm.eligible_backlog_count||0} | Active: ${(d.capacity||{}).active_count||0}`;
      document.getElementById('cap').textContent=`ชุดใหม่วันนี้เหลือ: ${(d.capacity||{}).remaining_today||0} / ${(cm.config||{}).max_new_rechecks_per_day||'?'}`;
      document.getElementById('cats').innerHTML=Object.entries(d.categories||{}).map(([k,v])=>`<div class="card"><h3>${v.label_th}</h3><div class="n">${v.count}${v.capacity?` <span class="muted" style="font-size:.8rem">(${v.capacity})</span>`:''}</div></div>`).join('');
      document.getElementById('queueRows').innerHTML=(d.active_queue_rows||[]).map(x=>`<tr><td>${x.property_code_display||x.property_id}</td><td>${x.record_age_days||0}</td><td>${x.listing_kind||'-'}</td><td>${tag(x.queue_state)}</td><td>${x.assigned_operator_id||'-'}</td></tr>`).join('');
      document.getElementById('backlogRows').innerHTML=(cm.backlog_sample||[]).map(x=>`<tr><td>${x.property_code_display||x.property_id}</td><td>${x.project_name_display||'-'}</td><td>${x.record_age_days||0}</td><td>${x.priority_score||0}</td></tr>`).join('');
    }
    async function boot(){
      await fetch('/api/auth/login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:'angkarn1996',password:'localdev'})});
      await load();
    }
    document.getElementById('pullBtn').onclick=async()=>{await api('/api/recheck-capacity/release-batch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({strategy:'rent_first'})});await load();};
    document.getElementById('seedBtn').onclick=async()=>{await api('/api/property-status-recheck/seed-fixtures',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});await load();};
    document.getElementById('syncBtn').onclick=async()=>{await api('/api/notifications/sync',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});alert('ซิงก์ภายในแล้ว');};
    boot();
  </script>
</body>
</html>
