# Health check for Property Hub custom domain (Fly / primary host).
# Does not touch LivingBKK / realxtateth.com apex. Do not rely on Render.
name: Hub keepalive

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping hub.realxtateth.com
        run: |
          set -e
          url="https://hub.realxtateth.com/api/health"
          code=$(curl -sS -o /tmp/hub_health.json -w "%{http_code}" --max-time 60 "$url" || echo "000")
          echo "$url -> HTTP $code"
          head -c 200 /tmp/hub_health.json; echo
          if [ "$code" != "200" ]; then
            echo "keepalive failed — admins should use hub.realxtateth.com only"
            exit 1
          fi
